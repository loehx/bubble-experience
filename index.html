  <body>
    <svg width="0" height="0" aria-hidden="true" class="pointer-events-none absolute">
      <defs>
        <filter id="face-outline" x="-15%" y="-15%" width="130%" height="130%">
          <feMorphology in="SourceAlpha" operator="dilate" radius="3" result="dilated" />
          <feFlood flood-color="#ffffff" result="outline-color" />
          <feComposite in="outline-color" in2="dilated" operator="in" result="outline" />
          <feMerge>
            <feMergeNode in="outline" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
